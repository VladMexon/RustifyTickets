# Списки ключевых слов для классификации заявок.
#
# Формат категории:
#   name     — имя категории (уникальное)
#   include  — список слов-включений; текст относится к категории, если
#              содержит хотя бы одно слово из списка
#   exclude  — список слов-исключений; если текст содержит хотя бы одно из
#              них, категория для этого текста не применяется
#   weight   — вес одного совпадения (необязательно, по умолчанию 1).
#              Категория с наибольшей суммой весов совпавших слов побеждает.
#   priority — приоритет при равенстве весов (меньше число = выше приоритет;
#              необязательно, по умолчанию порядковый номер категории)
#
# Сопоставление выполняется по подстроке в тексте, приведённом к нижнему
# регистру. Учитывайте формы слов: пишите корень слова без окончания
# (например, "газоанализ" покрывает "газоанализатор" и "газоанализаторы").

version = 2

[[category]]
name = "Петроникс - Сменный отчет"
priority = 0
include = [
  "непроведенные чеки",
